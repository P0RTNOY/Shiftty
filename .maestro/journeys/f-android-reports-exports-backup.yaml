appId: ${APP_ID}
name: F Android - finalized zero reaches native export and backup share workflows
tags:
  - smoke
  - exports
  - backup
  - android
---
- clearState
- launchApp
- runFlow: ../helpers/complete-first-use.yaml
- tapOn:
    id: e2e-home-clock-in
- scrollUntilVisible:
    element:
      id: e2e-active-clock-out
    direction: DOWN
    timeout: 30000
    centerElement: true
- tapOn:
    id: e2e-active-clock-out
- scrollUntilVisible:
    element:
      id: e2e-clock-out-save
    direction: DOWN
    centerElement: true
- tapOn:
    id: e2e-clock-out-save
- extendedWaitUntil:
    visible:
      id: e2e-tab-reports
    timeout: 30000
- tapOn:
    id: e2e-tab-reports
- assertVisible:
    id: e2e-reports-estimated-total
- tapOn:
    id: e2e-reports-export
- tapOn:
    id: e2e-export-pdf
- waitForAnimationToEnd
- pressKey: Back
- tapOn:
    id: e2e-export-csv
- waitForAnimationToEnd
- pressKey: Back
- tapOn:
    id: e2e-export-ics
- waitForAnimationToEnd
- pressKey: Back
- pressKey: Back
- tapOn:
    id: e2e-tab-settings
- tapOn:
    id: e2e-settings-backup
- assertVisible:
    id: e2e-backup-export
- assertVisible:
    id: e2e-backup-restore
- tapOn:
    id: e2e-backup-export
- waitForAnimationToEnd
- pressKey: Back
