appId: ${APP_ID}
name: B - live shift and open break survive a cold relaunch
tags:
  - smoke
  - active-shift
---
- clearState
- launchApp
- runFlow: ../helpers/complete-first-use.yaml
- tapOn:
    id: e2e-home-clock-in
- extendedWaitUntil:
    visible:
      id: e2e-active-shift-panel
    timeout: 15000
- scrollUntilVisible:
    element:
      id: e2e-active-start-break
    direction: DOWN
- tapOn:
    id: e2e-active-start-break
- assertVisible:
    id: e2e-active-end-break
- pressKey: Home
- launchApp
- extendedWaitUntil:
    visible:
      id: e2e-active-shift-panel
    timeout: 30000
- scrollUntilVisible:
    element:
      id: e2e-active-end-break
    direction: DOWN
- assertVisible:
    id: e2e-active-end-break
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: e2e-active-shift-panel
    timeout: 30000
- scrollUntilVisible:
    element:
      id: e2e-active-end-break
    direction: DOWN
- assertVisible:
    id: e2e-active-end-break
- tapOn:
    id: e2e-active-end-break
- tapOn:
    id: e2e-active-clock-out
- assertVisible:
    id: e2e-clock-out-review
- scrollUntilVisible:
    element:
      id: e2e-clock-out-save
    direction: DOWN
    centerElement: true
- tapOn:
    id: e2e-clock-out-save
- extendedWaitUntil:
    visible:
      id: e2e-home-clock-in
    timeout: 30000
- assertNotVisible:
    id: e2e-active-shift-panel
- assertVisible:
    id: e2e-home-completed-summary
- tapOn:
    id: e2e-tab-calendar
- extendedWaitUntil:
    visible:
      id: e2e-calendar-shift-card
    timeout: 30000
- tapOn:
    id: e2e-calendar-shift-card
- assertVisible:
    id: e2e-shift-details
- pressKey: Back
- tapOn:
    id: e2e-tab-reports
- extendedWaitUntil:
    visible:
      id: e2e-report-row-.*
    timeout: 30000
